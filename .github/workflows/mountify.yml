name: Build nuke.ko Only

on:
  workflow_dispatch:
    inputs:
      sub_level:
        description: 'Kernel sub level (e.g. 23)'
        required: true
        type: string
        default: '23'

jobs:
  build:
    name: Build nuke.ko 6.12.${{ inputs.sub_level }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ANDROID_VERSION: 'android16'

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Free Disk Space & Install Dependencies
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          sudo docker image prune -af 2>/dev/null || true
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            binutils python-is-python3 libssl-dev libelf-dev libdw-dev \
            curl bison flex make git perl gcc bc zip unzip aria2 \
            m4

      - name: Initialize Workspace & Toolchains
        run: |
          mkdir -p kernel_workspace && cd kernel_workspace 
          
          aria2c -s16 -x16 -k1M "https://github.com/yapixel/gki-build-assets/releases/download/android16-6.12-2025-06_r58/common-android16-6.12-2025-06_r58.tar.gz" -o common.tar.gz
          mkdir -p common && tar -xzf common.tar.gz -C common && rm common.tar.gz
          
          aria2c -s16 -x16 -k1M "https://github.com/yapixel/gki-build-assets/releases/download/r536225/clang-r536225.tar.gz" -o clang.tar.gz
          mkdir -p clang && tar -xzf clang.tar.gz -C clang && rm clang.tar.gz
          
          aria2c -s16 -x16 -k1M "https://github.com/yapixel/gki-build-assets/releases/download/r536225/build-tools.tar.gz" -o build-tools.tar.gz
          mkdir -p build-tools && tar -xzf build-tools.tar.gz -C build-tools && rm build-tools.tar.gz
          
          sed -i 's/ -dirty//g' common/scripts/setlocalversion

      - name: Clone and Inject nuke_ext4 LKM Source
        run: |
          # 1. 直接克隆到内核源码树的 drivers 目录下
          git clone --depth=1 https://github.com/yapixel/mountify mountify_repo
          mv mountify_repo/nuke_ext4_lkm kernel_workspace/common/drivers/nuke_ext4_lkm
          rm -rf mountify_repo
          
          # 2. 挂载到主编译链中
          cd kernel_workspace/common
          sed -i '/endmenu/i source "drivers/nuke_ext4_lkm/Kconfig"' drivers/Kconfig
          echo 'obj-m += drivers/nuke_ext4_lkm/' >> drivers/Makefile

      - name: Compile nuke.ko Only
        run: |
          WORKDIR="$(pwd)"
          export PATH="$WORKDIR/kernel_workspace/clang/bin:$PATH"
          export PATH="$WORKDIR/kernel_workspace/build-tools/bin:$PATH"
          
          cd kernel_workspace/common
          
          COMMON_REAL_PATH=$(pwd -P)
          ROOT_REAL_PATH=$(dirname "$COMMON_REAL_PATH")
          KCFLAGS=" -fdebug-prefix-map=$ROOT_REAL_PATH=."
          KCFLAGS+=" -fmacro-prefix-map=$ROOT_REAL_PATH=."
          KCFLAGS+=" -ffile-prefix-map=$ROOT_REAL_PATH=."
          KCFLAGS+=" -no-canonical-prefixes -O2 -pipe -Wno-error -fno-stack-protector -D__ANDROID_COMMON_KERNEL__"
          export KCFLAGS
          
          export LLVM=1
          export LLVM_IAS=1
          export ARCH=arm64
          export SUBARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export HOSTCC=clang
          export HOSTLD=ld.lld
          export CC=clang
          export LD=ld.lld
          export AR=llvm-ar
          export NM=llvm-nm
          export OBJCOPY=llvm-objcopy
          export OBJDUMP=llvm-objdump
          export READELF=llvm-readelf
          export STRIP=llvm-strip
          
          export SOURCE_DATE_EPOCH=1757653061
          export KBUILD_BUILD_TIMESTAMP="Fri Sep 12 04:57:41 UTC 2025"
          export KBUILD_BUILD_HOST="build-host"
          export KBUILD_BUILD_USER="kleaf"
          
          # 生成基准配置并注入模块编译开关
          make -j$(nproc --all) O=out gki_defconfig
          echo "CONFIG_NUKE_EXT4_LKM=m" >> out/.config
          make -j$(nproc --all) O=out olddefconfig
          
          # 精准编译：通过指定外部模块目录参数，跳过核心镜像编译，但共用完整的符号导出流程
          make -j$(nproc --all) O=out M=drivers/nuke_ext4_lkm modules
          
          echo "模块编译完成！"

      - name: Collect and Verify Output
        id: pkg
        run: |
          cd kernel_workspace
          MODULE_KO=$(find ./common/out/drivers/nuke_ext4_lkm -name "nuke_ext4_lkm.ko" -o -name "nuke.ko" | head -n 1)
          if [ -f "$MODULE_KO" ]; then
            echo "Found compiled LKM: $MODULE_KO"
            cp "$MODULE_KO" ./nuke.ko
          else
            echo "Error: nuke.ko binary missing!" && exit 1
          fi

      - name: Upload nuke.ko Artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: nuke-module
          path: kernel_workspace/nuke.ko
