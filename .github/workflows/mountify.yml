name: Build nuke.ko Only

on:
  workflow_dispatch:
    inputs:
      sub_level:
        description: 'Kernel sub level (e.g. 23)'
        required: true
        type: string
        default: '23'

jobs:
  build:
    name: Build nuke.ko 6.12.${{ inputs.sub_level }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ANDROID_VERSION: android16

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Free Disk Space and Install Dependencies
        run: |
          set -euxo pipefail

          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          sudo docker image prune -af 2>/dev/null || true

          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            binutils \
            python-is-python3 \
            libssl-dev \
            libelf-dev \
            libdw-dev \
            curl \
            bison \
            flex \
            make \
            git \
            perl \
            gcc \
            bc \
            zip \
            unzip \
            aria2 \
            m4 \
            rsync \
            dwarves

      - name: Initialize Workspace and Toolchains
        run: |
          set -euxo pipefail

          mkdir -p kernel_workspace
          cd kernel_workspace

          aria2c -s16 -x16 -k1M \
            "https://github.com/yapixel/gki-build-assets/releases/download/android16-6.12-2025-06_r58/common-android16-6.12-2025-06_r58.tar.gz" \
            -o common.tar.gz

          mkdir -p common
          tar -xzf common.tar.gz -C common
          rm -f common.tar.gz

          aria2c -s16 -x16 -k1M \
            "https://github.com/yapixel/gki-build-assets/releases/download/r536225/clang-r536225.tar.gz" \
            -o clang.tar.gz

          mkdir -p clang
          tar -xzf clang.tar.gz -C clang
          rm -f clang.tar.gz

          aria2c -s16 -x16 -k1M \
            "https://github.com/yapixel/gki-build-assets/releases/download/r536225/build-tools.tar.gz" \
            -o build-tools.tar.gz

          mkdir -p build-tools
          tar -xzf build-tools.tar.gz -C build-tools
          rm -f build-tools.tar.gz

          sed -i 's/ -dirty//g' common/scripts/setlocalversion || true

      - name: Clone and Inject nuke_ext4 LKM Source
        run: |
          set -euxo pipefail

          git clone --depth=1 https://github.com/yapixel/mountify mountify_repo

          TARGET_DIR="$(find mountify_repo -type f -name "Makefile" | grep "nuke_ext4_lkm" | head -n 1 | xargs dirname || true)"

          if [ -z "$TARGET_DIR" ]; then
            echo "Error: Cannot find valid module directory with Makefile!"
            find mountify_repo -maxdepth 6 -type f -name "Makefile" -print || true
            exit 1
          fi

          echo "Found module source: $TARGET_DIR"

          rm -rf kernel_workspace/common/drivers/nuke_ext4_lkm
          mv "$TARGET_DIR" kernel_workspace/common/drivers/nuke_ext4_lkm
          rm -rf mountify_repo

          cd kernel_workspace/common

          if [ ! -f drivers/nuke_ext4_lkm/Kconfig ]; then
            cat > drivers/nuke_ext4_lkm/Kconfig << 'EOF'
          config NUKE_EXT4_LKM
              tristate "nuke ext4 lkm"
              default m
          EOF
          fi

          if ! grep -q 'drivers/nuke_ext4_lkm/Kconfig' drivers/Kconfig; then
            sed -i '/endmenu/i source "drivers/nuke_ext4_lkm/Kconfig"' drivers/Kconfig
          fi

          if ! grep -q 'nuke_ext4_lkm' drivers/Makefile; then
            echo 'obj-m += nuke_ext4_lkm/' >> drivers/Makefile
          fi

          echo "Injected nuke_ext4_lkm successfully"
          ls -la drivers/nuke_ext4_lkm

      - name: Compile nuke.ko Only
        run: |
          set -euxo pipefail

          WORKDIR="$(pwd)"

          export PATH="$WORKDIR/kernel_workspace/clang/bin:$PATH"
          export PATH="$WORKDIR/kernel_workspace/build-tools/bin:$PATH"

          cd kernel_workspace/common

          COMMON_REAL_PATH="$(pwd -P)"
          ROOT_REAL_PATH="$(dirname "$COMMON_REAL_PATH")"

          export KCFLAGS=" -fdebug-prefix-map=$ROOT_REAL_PATH=."
          export KCFLAGS="$KCFLAGS -fmacro-prefix-map=$ROOT_REAL_PATH=."
          export KCFLAGS="$KCFLAGS -ffile-prefix-map=$ROOT_REAL_PATH=."
          export KCFLAGS="$KCFLAGS -no-canonical-prefixes -O2 -pipe -Wno-error -fno-stack-protector -D__ANDROID_COMMON_KERNEL__"

          export LLVM=1
          export LLVM_IAS=1
          export ARCH=arm64
          export SUBARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-

          export HOSTCC=clang
          export HOSTLD=ld.lld
          export CC=clang
          export LD=ld.lld
          export AR=llvm-ar
          export NM=llvm-nm
          export OBJCOPY=llvm-objcopy
          export OBJDUMP=llvm-objdump
          export READELF=llvm-readelf
          export STRIP=llvm-strip

          export SOURCE_DATE_EPOCH=1757653061
          export KBUILD_BUILD_TIMESTAMP="Fri Sep 12 04:57:41 UTC 2025"
          export KBUILD_BUILD_HOST="build-host"
          export KBUILD_BUILD_USER="kleaf"

          make -j"$(nproc --all)" O=out gki_defconfig

          echo "CONFIG_NUKE_EXT4_LKM=m" >> out/.config
          make -j"$(nproc --all)" O=out olddefconfig

          echo "===== Kernel module related config ====="
          grep -E '^CONFIG_MODULES=|^CONFIG_MODVERSIONS=|^CONFIG_MODULE_SIG=|^CONFIG_CFI|^CONFIG_LTO|^CONFIG_KALLSYMS|^CONFIG_KPROBES' out/.config || true

          make -j"$(nproc --all)" O=out modules_prepare

          if grep -q '^CONFIG_MODVERSIONS=y' out/.config; then
            if [ ! -s out/Module.symvers ]; then
              echo "Error: CONFIG_MODVERSIONS=y but out/Module.symvers is missing or empty."
              echo "Refusing to build/upload nuke.ko because symbol CRC may be unsafe."
              exit 1
            fi
          fi

          make -j"$(nproc --all)" \
            O=out \
            M="$COMMON_REAL_PATH/drivers/nuke_ext4_lkm" \
            modules

          echo "Module build finished"

      - name: Collect and Verify Output
        id: pkg
        run: |
          set -euxo pipefail

          cd kernel_workspace

          echo "Searching for compiled ko files..."
          find ./common -type f -name "*.ko" -print || true

          MODULE_KO="$(find ./common -type f \( -name "nuke_ext4_lkm.ko" -o -name "nuke.ko" \) | head -n 1 || true)"

          if [ -z "$MODULE_KO" ] || [ ! -f "$MODULE_KO" ]; then
            echo "Error: nuke.ko binary missing!"
            echo "All ko files:"
            find ./common -type f -name "*.ko" -print || true
            exit 1
          fi

          echo "Found compiled LKM: $MODULE_KO"
          cp -f "$MODULE_KO" ./nuke.ko

          file ./nuke.ko || true
          ls -lh ./nuke.ko

      - name: Inspect nuke.ko Safety
        run: |
          set -euxo pipefail

          cd kernel_workspace

          {
            echo "===== nuke.ko file ====="
            file ./nuke.ko || true
            echo

            echo "===== nuke.ko modinfo ====="
            modinfo ./nuke.ko || true
            echo

            echo "===== nuke.ko vermagic ====="
            modinfo ./nuke.ko | grep -i '^vermagic' || true
            echo

            echo "===== nuke.ko depends ====="
            modinfo ./nuke.ko | grep -i '^depends' || true
            echo

            echo "===== Undefined symbols ====="
            nm -u ./nuke.ko || true
            echo

            echo "===== Dangerous symbol scan ====="
            nm -u ./nuke.ko | grep -E 'kallsyms_lookup_name|set_memory_rw|set_memory_ro|set_memory_x|set_memory_nx|text_poke|stop_machine|register_kprobe|unregister_kprobe|kprobe|ftrace|kallsyms|sprint_symbol|lookup_symbol_name' || true
            echo

            echo "===== ELF header ====="
            readelf -h ./nuke.ko || true
            echo

            echo "===== Important ELF sections ====="
            readelf -S ./nuke.ko | grep -E '\.modinfo|\.text|\.init|\.exit|__versions' || true
            echo
          } > ./nuke-module-info.txt

          cat ./nuke-module-info.txt

          echo "===== Strict dangerous symbol warning ====="
          if nm -u ./nuke.ko | grep -E 'kallsyms_lookup_name|set_memory_rw|set_memory_ro|set_memory_x|set_memory_nx|text_poke|stop_machine|register_kprobe|unregister_kprobe|kprobe|ftrace|kallsyms|sprint_symbol|lookup_symbol_name'; then
            echo "::warning::nuke.ko references dangerous hook/patch/symbol-lookup related symbols."
            echo "::warning::This may still bootloop if module_init patches kernel/ext4 incorrectly."
          fi

      - name: Upload nuke.ko Artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: nuke-module
          path: |
            kernel_workspace/nuke.ko
            kernel_workspace/nuke-module-info.txt
