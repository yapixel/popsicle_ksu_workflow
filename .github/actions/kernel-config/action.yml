name: "Inject Kernel Configs"
description: "Applies standard networking, performance, and KSU flags safely"

inputs:
  defconfig_path:
    required: true
    description: "Path to defconfig"
  build_config_path:
    required: true
    description: "Path to build.config.gki"
  variant:
    required: true
    description: "KSU variant"
  enable_susfs:
    required: false
    default: "false"

runs:
  using: "composite"
  steps:
    - name: Apply Configurations
      shell: bash
      run: |
        set -e

        DEFCONFIG="${{ inputs.defconfig_path }}"
        BUILD_CONFIG="${{ inputs.build_config_path }}"

        ########################################
        # Helper functions (NO DUPLICATES)
        ########################################

        set_config() {
          local key="$1"
          local value="$2"
          local file="$3"

          sed -i "/^${key}=.*/d" "$file"
          sed -i "/^# ${key} is not set/d" "$file"
          echo "${key}=${value}" >> "$file"
        }

        unset_config() {
          local key="$1"
          local file="$2"

          sed -i "/^${key}=.*/d" "$file"
          sed -i "/^# ${key} is not set/d" "$file"
          echo "# ${key} is not set" >> "$file"
        }

        ########################################
        # Localversion (clean replacement)
        ########################################
        sed -i '/CONFIG_LOCALVERSION/d' "$DEFCONFIG"
        echo 'CONFIG_LOCALVERSION="-android16-5-g6928909e3148-abogki444322847-4k"' >> "$DEFCONFIG"

        ########################################
        # Core Boot + Performance
        ########################################
        set_config CONFIG_CC_OPTIMIZE_FOR_PERFORMANCE y "$DEFCONFIG"
        set_config CONFIG_RUST y "$DEFCONFIG"
        set_config CONFIG_LOG_BUF_SHIFT 21 "$DEFCONFIG"
        set_config CONFIG_ANDROID_BINDER_IPC_RUST m "$DEFCONFIG"
        set_config CONFIG_TMPFS_XATTR y "$DEFCONFIG"
        set_config CONFIG_TMPFS_POSIX_ACL y "$DEFCONFIG"

        ########################################
        # Networking
        ########################################
        set_config CONFIG_IP_NF_TARGET_TTL y "$DEFCONFIG"
        set_config CONFIG_IP6_NF_TARGET_HL y "$DEFCONFIG"
        set_config CONFIG_IP6_NF_MATCH_HL y "$DEFCONFIG"
        set_config CONFIG_TCP_CONG_ADVANCED y "$DEFCONFIG"
        set_config CONFIG_TCP_CONG_BBR y "$DEFCONFIG"
        set_config CONFIG_NET_SCH_FQ y "$DEFCONFIG"

        ########################################
        # IPSet + Netfilter
        ########################################
        set_config CONFIG_IP_SET y "$DEFCONFIG"
        set_config CONFIG_IP_SET_MAX 65534 "$DEFCONFIG"

        for opt in \
          CONFIG_NETFILTER_XT_SET \
          CONFIG_IP_SET_BITMAP_IP \
          CONFIG_IP_SET_BITMAP_IPMAC \
          CONFIG_IP_SET_BITMAP_PORT \
          CONFIG_IP_SET_HASH_IP \
          CONFIG_IP_SET_HASH_IPMARK \
          CONFIG_IP_SET_HASH_IPPORT \
          CONFIG_IP_SET_HASH_IPPORTIP \
          CONFIG_IP_SET_HASH_IPPORTNET \
          CONFIG_IP_SET_HASH_IPMAC \
          CONFIG_IP_SET_HASH_MAC \
          CONFIG_IP_SET_HASH_NETPORTNET \
          CONFIG_IP_SET_HASH_NET \
          CONFIG_IP_SET_HASH_NETNET \
          CONFIG_IP_SET_HASH_NETPORT \
          CONFIG_IP_SET_HASH_NETIFACE \
          CONFIG_IP_SET_LIST_SET
        do
          set_config "$opt" y "$DEFCONFIG"
        done

        for opt in \
          CONFIG_NETFILTER_XT_TARGET_TPROXY \
          CONFIG_NETFILTER_XT_TARGET_REDIRECT \
          CONFIG_NETFILTER_XT_MATCH_SOCKET \
          CONFIG_NETFILTER_XT_MATCH_MARK \
          CONFIG_NETFILTER_XT_MATCH_ADDRTYPE \
          CONFIG_NETFILTER_XT_MATCH_IPRANGE \
          CONFIG_NETFILTER_XT_MATCH_OWNER \
          CONFIG_NETFILTER_XT_MATCH_MAC \
          CONFIG_NETFILTER_XT_MATCH_CONNTRACK \
          CONFIG_NETFILTER_XT_MARK \
          CONFIG_NETFILTER_XT_CONNMARK \
          CONFIG_NETFILTER_XT_TARGET_CONNMARK \
          CONFIG_IP6_NF_NAT \
          CONFIG_IP6_NF_TARGET_REDIRECT
        do
          set_config "$opt" y "$DEFCONFIG"
        done

        ########################################
        # KSU Variants
        ########################################
        case "${{ inputs.variant }}" in

          xxksu)
            set_config CONFIG_KSU y "$DEFCONFIG"
            set_config CONFIG_KSU_EXTRAS y "$DEFCONFIG"
            set_config CONFIG_KSU_TAMPER_SYSCALL_TABLE y "$DEFCONFIG"
            set_config CONFIG_KSU_LSM_SECURITY_HOOKS y "$DEFCONFIG"
            ;;

          xxksu_old)
            set_config CONFIG_KSU y "$DEFCONFIG"
            set_config CONFIG_KSU_EXTRAS y "$DEFCONFIG"
            set_config CONFIG_KSU_HACK_ARM64_BRANCH_LINK y "$DEFCONFIG"
            set_config CONFIG_KSU_LSM_SECURITY_HOOKS y "$DEFCONFIG"
            ;;

          xxksu_staging)
            set_config CONFIG_KSU y "$DEFCONFIG"
            set_config CONFIG_KSU_EXTRAS y "$DEFCONFIG"
            set_config CONFIG_KSU_DEBUG y "$DEFCONFIG"
            set_config CONFIG_KSU_TAMPER_SYSCALL_TABLE y "$DEFCONFIG"
            set_config CONFIG_KSU_LSM_SECURITY_HOOKS y "$DEFCONFIG"
            unset_config CONFIG_MODULE_SIG_FORCE "$DEFCONFIG"
            unset_config CONFIG_MODULE_SIG_ALL "$DEFCONFIG"
            set_config CONFIG_MODULE_UNLOAD y "$DEFCONFIG"
            ;;

          xxksu_manual)
            set_config CONFIG_KSU y "$DEFCONFIG"
            set_config CONFIG_KSU_EXTRAS y "$DEFCONFIG"
            set_config CONFIG_KSU_LSM_SECURITY_HOOKS n "$DEFCONFIG"
            set_config CONFIG_KSU_KPROBES_KSUD n "$DEFCONFIG"
            ;;

          *kowsu*)
            set_config CONFIG_KSU y "$DEFCONFIG"
            set_config CONFIG_KPROBES y "$DEFCONFIG"
            set_config CONFIG_HAVE_KPROBES y "$DEFCONFIG"
            ;;

        esac

        ########################################
        # SuSFS
        ########################################
        if [ "${{ inputs.enable_susfs }}" = "true" ]; then
          for opt in \
            CONFIG_KSU_SUSFS \
            CONFIG_KSU_SUSFS_HAS_MAGIC_MOUNT \
            CONFIG_KSU_SUSFS_SUS_PATH \
            CONFIG_KSU_SUSFS_SUS_MOUNT \
            CONFIG_KSU_SUSFS_AUTO_ADD_SUS_KSU_DEFAULT_MOUNT \
            CONFIG_KSU_SUSFS_AUTO_ADD_SUS_BIND_MOUNT \
            CONFIG_KSU_SUSFS_SUS_KSTAT \
            CONFIG_KSU_SUSFS_TRY_UMOUNT \
            CONFIG_KSU_SUSFS_AUTO_ADD_TRY_UMOUNT_FOR_BIND_MOUNT \
            CONFIG_KSU_SUSFS_SPOOF_UNAME \
            CONFIG_KSU_SUSFS_ENABLE_LOG \
            CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS \
            CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG \
            CONFIG_KSU_SUSFS_OPEN_REDIRECT \
            CONFIG_KSU_SUSFS_SUS_MAP
          do
            set_config "$opt" y "$DEFCONFIG"
          done
        fi

        ########################################
        # Disable GKI defconfig check (optional)
        ########################################
        sed -i 's/check_defconfig//' "$BUILD_CONFIG" || true
